<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ранцевый алгоритм</title>
<style>

h1 {
    text-align: center;
    color: #eee8d5;
}
div {
    color: #eee8d5;
    text-align: center;
    margin: 8px 0;
}
input {
    font-size: 14px;
    padding: 3px;
}
textarea {
    width: 80%;
    height: 60px;
    font-size: 14px;
}

</style>

</body>

<h1>РАНЦЕВЫЙ АЛГОРИТМ ШИФРОВАНИЯ</h1>

<div>q= <input type="text" id="q" value="257"> , r= <input type="text" id="r" value="3"></div>

<div>w= <input type="text" id="w" value="1,2,4,8,16,32,64,128" style="width:300px;"></div>

<div>Зашифрованная строка:</div>
<div><textarea id="enc"></textarea></div>

<div><input type="button" id="create" value="Расшифровать"></div>

<div>Текст = <span id="res"></span></div>

<script>
var koi8 = {
    'А':225,'Б':226,'В':247,'Г':231,'Д':228,'Е':229,'Ё':163,
    'Ж':246,'З':250,'И':233,'Й':234,'К':235,'Л':236,'М':237,
    'Н':238,'О':239,'П':240,'Р':242,'С':243,'Т':244,'У':245,
    'Ф':230,'Х':232,'Ц':227,'Ч':254,'Ш':251,'Щ':253,'Ъ':255,
    'Ы':249,'Ь':248,'Э':252,'Ю':224,'Я':241,
    'а':193,'б':194,'в':215,'г':199,'д':196,'е':197,'ё':179,
    'ж':214,'з':218,'и':201,'й':202,'к':203,'л':204,'м':205,
    'н':206,'о':207,'п':208,'р':210,'с':211,'т':212,'у':213,
    'ф':198,'х':200,'ц':195,'ч':222,'ш':219,'щ':221,'ъ':223,
    'ы':217,'ь':216,'э':220,'ю':192,'я':209
}

var koi8Inv = {}
for (let ch in koi8) {
    koi8Inv[koi8[ch]] = ch
}

function modInv(a, m) {
    var m0 = m
    var x0 = 0
    var x1 = 1
    if (m == 1) return 0
    while (a > 1) {
        let qq = Math.floor(a / m)
        let t = m
        m = a % m
        a = t
        t = x0
        x0 = x1 - qq * x0
        x1 = t
    }
    if (x1 < 0) x1 += m0
    return x1
}

function go() {
    var q = parseInt(document.getElementById('q').value)
    var r = parseInt(document.getElementById('r').value)
    var wStr = document.getElementById('w').value
    var enc = document.getElementById('enc').value

    var W = wStr.split(',').map(Number)
    var rInv = modInv(r, q)
    var B = []
    for (let i = 0; i < W.length; i++) {
        B[i] = (W[i] * r) % q
    }

    var rStr = ''
    for (let k = 0; k < enc.length; k++) {
        let c = enc.charCodeAt(k)
        let cp = (c * rInv) % q
        let code = 0
        for (let i = W.length - 1; i >= 0; i--) {
            if (cp >= W[i]) {
                code = code | (1 << (W.length - 1 - i))
                cp = cp - W[i]
            }
        }
        if (code > 127 && koi8Inv[code]) {
            rStr += koi8Inv[code]
        } else {
            rStr += String.fromCharCode(code)
        }
    }
    document.getElementById('res').textContent = rStr
}

document.querySelector('#create').onclick = go;
</script>

</body>
</html>
